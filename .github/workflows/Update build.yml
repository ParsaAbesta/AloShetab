نام: build-aloshetab
# ساخت خودکار ایمیج داکر الو شتاب — بدون نیاز به آپلود Dockerfile (خودنویس)
# نتیجه: ghcr.io/<نام-کاربری-شما>/aloshetab:5.0.0 (Public)

در:
  فشار:
    مسیرها:
      - "alo_shetab_release_v5.0.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

مجوزها:
  محتوا: بخوانید
  بسته‌ها: نوشتن

مشاغل:
  داکر:
    اجرا می‌شود: اوبونتو-آخرین نسخه
    مراحل:
      - نام: پرداخت
        موارد استفاده: actions/checkout@v4

      - name: نسخه فشرده را در ریشه مخزن از حالت فشرده خارج کنید
        اجرا کنید: unzip -o alo_shetab_release_v5.0.zip -d .

      - نام: نوشتن فایل داکر
        اجرا: |
          گربه > داکرفایل <<'DOCKERFILE_EOF'
          # ─── الو شتاب — ایمیج Production V5.0 ──────────────────────
          از گره:22-بخش‌های خودگردان آلپاین
          دایرکتوری کار /برنامه
          اجرای apk add --no-cache openssl
          کپی package.json ./
          دستور npm install --legacy-peer-deps را اجرا کنید.

          از گره: سازنده AS-22-alpine
          دایرکتوری کار /برنامه
          اجرای apk add --no-cache openssl
          کپی --from=deps /app/node_modules ./node_modules
          کپی .
          ENV DATABASE_URL=file:/tmp/build.db
          دستور زیر را اجرا کنید: npx prisma generate && npx prisma db push --accept-data-loss \
              && npm اجرای ساخت

          از گره: دونده AS-22-alpine
          دایرکتوری کار /برنامه
          اجرای apk add --no-cache openssl \
              && addgroup -S alo && adduser -S alo -G alo \
              && mkdir -p /app/db && chown -R به صورت زیر عمل کنید: به صورت زیر عمل کنید /app

          ENV NODE_ENV=production
          پورت ENV=3000
          نام میزبان ENV=0.0.0.0
          ENV DATABASE_URL=file:/app/db/custom.db

          کپی --from=builder --chown=alo:alo /app/.next/standalone ./
          کپی --from=builder --chown=alo:alo /app/.next/static ./.next/static
          کپی --from=builder --chown=alo:alo /app/public ./public
          کپی --from=builder --chown=alo:alo /app/prisma ./prisma
          کپی --from=builder --chown=alo:alo /app/scripts/seed104.mjs ./scripts/seed104.mjs
          کپی --from=builder --chown=alo:alo /app/scripts/catalog104_enriched.json ./scripts/catalog104_enriched.json
          کپی --from=builder --chown=alo:alo /app/download/alo_shetab_services_rates_1405-08-24.json ./download/alo_shetab_services_rates_1405-08-24.json
          کپی --from=builder --chown=alo:alo /app/package.json ./package.json
          کپی --from=builder --chown=alo:alo /app/node_modules/prisma ./node_modules/prisma
          کپی --from=builder --chown=alo:alo /app/node_modules/@prisma ./node_modules/@prisma
          کپی --from=builder --chown=alo:alo /app/node_modules/.bin/prisma ./node_modules/.bin/prisma

          کاربر همچنین
          نمایش ۳۰۰۰
          حجم ["/app/db"]

          دستور CMD ["sh", "-c", "npx prisma db push --accept-data-loss && if [ \"$SEED_ON_START\" = \"true\" ]; then node scripts/seed104.mjs || echo 'seed skipped'; fi; node server.js"]
          DOCKERFILE_EOF
          echo "فایل داکر نوشته شده است: $(wc -l < ​​Dockerfile) lines"

      - نام: مالک تصویر با حروف کوچک
        شناسه: img
        اجرا کنید: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aloshetab:5.0.0" >> "$GITHUB_OUTPUT"

      - نام: راه‌اندازی Buildx
        موارد استفاده: docker/setup-buildx-action@v3

      - نام: ورود به GHCR
        موارد استفاده: docker/login-action@v3
        با:
          رجیستری: ghcr.io
          نام کاربری: ${{ github.actor }}
          رمز عبور: ${{ secrets.GITHUB_TOKEN }}

      - نام: بساز و فشار بده
        موارد استفاده: docker/build-push-action@v6
        با:
          زمینه:
          فشار: درست
          برچسب‌ها: ${{ steps.img.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - نام: انجام شد
        اجرا: echo "IMAGE => ${{ steps.img.outputs.name }}"
