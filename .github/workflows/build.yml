name: build-aloshetab
# ساخت خودکار ایمیج داکر الو شتاب از روی بستهٔ release — بدون نیاز به کامپیوتر
# نتیجه: ghcr.io/<نام-کاربری-شما>/aloshetab:5.0.0  (Public)

on:
  push:
    paths:
      - "alo_shetab_release_v5.0.zip"
      - "Dockerfile"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip release into repo root
        run: unzip -o alo_shetab_release_v5.0.zip -d .

      - name: Lowercase image owner
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aloshetab:5.0.0" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.img.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Done
        run: echo "IMAGE => ${{ steps.img.outputs.name }}"
